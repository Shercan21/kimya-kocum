<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sanal Lab · Günlük Maddelerin pH’ı</title></head>
<body><script src="labkit.js"></script><script>
(()=>{const {CH,el,fmt,tr,sleep,tween,fade}=LK;
// ad, kısa, pH (az suyla), tür: a=asit b=baz t=tamponlu, renk, katı mı
const MD=[['Limon tuzu','Limon\ntuzu',1.4,'a','rgba(250,250,250,.95)',1],['Sıvı sabun','Sıvı\nsabun',9.6,'b','rgba(250,226,120,.85)',0],['Gazlı içecek','Gazlı\niçecek',2.4,'a','rgba(120,60,30,.8)',0],
 ['Karbonat','Karbonat',8.3,'t','rgba(250,250,250,.95)',1],['Sirke','Sirke',2.3,'a','rgba(240,230,200,.8)',0],['Diş macunu','Diş\nmacunu',9.6,'b','rgba(240,248,255,.95)',1],['Antiasit tablet','Antiasit',9.9,'b','rgba(245,245,245,.95)',1]];
const XS=[46,96,146,196,246,296,346];
function pHsu(i,vw){const [, ,p0,t]=MD[i];const D=Math.log10((1+vw)/1);return t==='a'?Math.min(7,p0+.8*D):t==='b'?Math.max(7,p0-.8*D):p0+.04*D;}
function oku(pH,arac){return arac==='metre'?fmt(pH,2):arac==='lahana'?CH.scaleColor(pH,'lahana').name:String(Math.round(pH));}
let TB=[],STR,ST;
const cfg={ad:'evdeph',baslik:'Günlük Hayattaki Maddelerin pH’ı',alt:'9. sınıf · 1.1.1 Günlük Hayatta Kimya · Günlük hayatta kullanılan bazı kimyasal maddelerin pH değerini belirleyebilme',
 malzemeler:['Limon tuzu','Sirke','Karbonat','Sıvı sabun','Diş macunu','Antiasit mide tableti','Gazlı içecek','Deney tüpleri','pH kâğıdı','Pens','Saf su','Baget','Etiket'],
 guvenlik:['⚠ Koruyucu gözlük','🧤 Eldiven','👅 Maddelerin tadına bakma','🧪 Cam malzeme'],
 olcumler:[['m','Madde',''],['p1','pH (ilk)',''],['p2','pH (5 mL su sonrası)','']],
 grafik:{baslik:'pH değerleri: ilk (kırmızı) ve su eklendikten sonra (mavi)',xmax:8,ymax:14,xl:'Madde no (1–7)',yl:'pH',not:'1 limon tuzu · 2 sıvı sabun · 3 gazlı içecek · 4 karbonat · 5 sirke · 6 diş macunu · 7 antiasit. Su eklenince değerler 7’ye yaklaşır.'},
 adimlar:[['Tüpleri etiketle','Her madde için ayrı bir deney tüpü kullan ve tüplere maddelerin adını yazdığın etiketleri yapıştır.'],
  ['Maddeleri koy','Maddeleri tüplere koy. Katı maddelerin (limon tuzu, karbonat, diş macunu, antiasit) üzerine 3–4 damla saf su ekleyip bagetle karıştır.'],
  ['pH kâğıdıyla ölç','Pens ile tuttuğun pH kâğıdını her tüpe daldır, rengini skala ile karşılaştır ve yaklaşık pH değerini tabloya yaz.'],
  ['5 mL saf su ekle','Her deney tüpüne 5 mL saf su ekle ve karıştır.'],
  ['pH’ı yeniden ölç','pH kâğıdıyla pH değerlerini yeniden ölç: asitlerin pH’ı biraz arttı, bazların pH’ı biraz azaldı; hepsi 7’ye yaklaştı.'],
  ['Sonucu yorumla','Limon tuzu, sirke ve gazlı içecek asidik; sıvı sabun, karbonat, diş macunu ve antiasit baziktir. Su eklemek asitliği ve bazlığı azaltır (seyrelme).']],
 async kur(P,m){const S=P.S;S.rack(18,374,440);S.phScale(20,40,360);
  TB=MD.map((d,i)=>{const t=S.tube(XS[i],500,130,20,'');t.g.setAttribute('opacity',m==='kitap'?0:1);d[1].split('\n').forEach((w,k)=>S.txt(t.g,XS[i],357+k*9-(d[1].includes('\n')?0:-4),w,7.5,{fill:'#1e293b'}));
    el('rect',{x:XS[i]-14,y:342,width:28,height:22,rx:2,fill:'#fff',opacity:.0},t.g);return t;});
  STR=S.phStrip(200,250);ST={};},
 async dip(P,i,pH){const t=TB[i],x=XS[i],y=t.level(t.vol)+12;STR.color('#f2e29b');STR.g.setAttribute('opacity',1);STR.to(x,250);
  await tween(600,k=>STR.to(x,250+(y-250)*k));await sleep(350);const c=CH.scaleColor(pH,'evrensel');STR.color(c.rgb);await tween(500,k=>STR.to(x,y-150*k));await sleep(350);STR.g.setAttribute('opacity',0);return c;},
 async calistir(P){P.graph.clear();const r1=P.graph.add('#dc2626',0,true),r2=P.graph.add('#2563eb',0,true);P.rows=[];
  P.stepUI(0);for(const t of TB)await fade(t.g,1,220);await sleep(500);
  P.stepUI(1);for(let i=0;i<7;i++){const d=MD[i],t=TB[i];if(d[5]){await tween(350,k=>{t.set(2*k,d[4]);t.ppt(k*.9,d[4]);});await tween(300,k=>t.set(2+.4*k,'rgba(230,240,252,.85)'));}else await tween(450,k=>t.set(3*k,d[4]));}
  await sleep(500);
  P.stepUI(2);for(let i=0;i<7;i++){const p=pHsu(i,0);P.set('m',MD[i][0]);await cfg.dip(P,i,p);P.set('p1',String(Math.round(p)));P.rows[i]=[MD[i][0],Math.round(p)];r1.pts.push([i+1,Math.round(p)]);P.graph.draw();await sleep(300);}
  P.stepUI(3);P.set('m','Tüm tüpler');for(let i=0;i<7;i++){const t=TB[i],d=MD[i],v0=t.vol;await tween(380,k=>t.set(v0+5*k,d[5]?'rgba(225,235,250,.85)':d[4].replace(/[\d.]+\)$/,'.55)')));}await sleep(400);
  P.stepUI(4);for(let i=0;i<7;i++){const p=pHsu(i,5);P.set('m',MD[i][0]);P.set('p1',String(P.rows[i][1]));await cfg.dip(P,i,p);P.set('p2',String(Math.round(p)));P.rows[i].push(Math.round(p),fmt(p,1));r2.pts.push([i+1,Math.round(p)]);P.graph.draw();await sleep(300);}
  P.stepUI(5);await sleep(700);
  P.calc('<b>Tablo</b><table><tr><th>Kimyasal madde</th><th>pH değeri</th><th>Saf su ilavesi sonrasında pH</th><th>Özellik</th></tr>'+P.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[1]<7?'asidik':r[1]>7?'bazik':'nötr'}</td></tr>`).join('')+'</table>');
  P.done('Asidik maddeler: limon tuzu, gazlı içecek, sirke. Bazik maddeler: sıvı sabun, karbonat, diş macunu, antiasit. Su eklenince pH değerleri 7’ye yaklaştı.');},
 rapor:P=>[['Deneyin Adı','Farklı Kimyasal Maddelerin Özelliklerini Belirleyebilme'],['Deneyin Amacı','Günlük hayatta kullanılan bazı kimyasal maddelerin pH değerini belirleyebilme'],['Tarih',new Date().toLocaleDateString('tr-TR')],
  ['Malzemeler',cfg.malzemeler.join(', ')],['Deneyin Yapılışı',cfg.adimlar.slice(0,5).map((x,i)=>`${i+1}. ${x[1]}`).join('<br>')],
  ['Gözlemler',P.rows.map(r=>`${r[0]}: pH ${r[1]} → su ilavesi sonrası ${r[2]}`).join('<br>')],
  ['Sonuç','pH < 7 olan maddeler asidik, pH > 7 olanlar baziktir. Saf su ilave edildiğinde çözeltiler seyrelir; asidik maddelerin pH’ı artar, bazik maddelerin pH’ı azalır. Diş macunu ıslak fırçayla seyreltilince bazik etkisi azalır (“Diş fırçanızı ıslatmayın!”). Antiasit tablet baziktir; suyla içilirse seyrelir, bu yüzden çiğneme tabletidir.']],
 sorular:[
  {q:'Deney tüplerine saf su eklenince maddelerin pH değeri nasıl değişti?',o:['Hepsi 7’den uzaklaştı','Hepsi 7’ye yaklaştı','Hepsi 0 oldu','Değişmedi'],a:1,e:'Seyrelme asitlik ve bazlığı azaltır: asitlerin pH’ı artar, bazlarınki azalır.'},
  {q:'“Diş fırçanızı ıslatmayın!” uyarısının nedeni nedir?',o:['Su diş macununu asidik yapar','Su diş macununu seyreltir, bazik etkisi azalır','Fırça bozulur','Diş macunu suda çözünmez'],a:1,e:'Su eklenince diş macununun pH’ı 7’ye yaklaşır; ağızdaki asitleri nötralleştirme etkisi azalır.'},
  {q:'Çaydanlıktaki kireci (CaCO₃) çözmek için neden limon tuzu kullanılır?',o:['Bazik olduğu için','Asidik olduğu için kireçle tepkimeye girer','Tuzlu olduğu için','Renkli olduğu için'],a:1,e:'Kireç (karbonat) asitlerle tepkimeye girip çözünür: CaCO₃ + asit → tuz + H₂O + CO₂.'},
  {q:'Antiasit tabletlerin çiğneme tableti olmasının nedeni nedir?',o:['Asidik oldukları için','Suyla seyreltilince bazlık etkisi azaldığı için','Tatlı oldukları için','Suda hiç çözünmedikleri için'],a:1,e:'Antiasit baziktir; seyreltilmeden mideye ulaşınca mide asidini daha etkili nötralleştirir.'}],
 dene:{
  alanlar:[{id:'md',ad:'Madde',secenek:MD.map((d,i)=>[i,d[0]]),deger:5},{id:'su',ad:'Eklenen saf su',secenek:[[0,'Yok (3–4 damla)'],[5,'5 mL'],[10,'10 mL'],[20,'20 mL']],deger:0},
   {id:'arac',ad:'Ölçüm aracı',secenek:[['kagit','pH kâğıdı'],['metre','pH metre'],['lahana','Kırmızı lahana suyu']],deger:'kagit'}],
  bagimli:[['p','pH değeri / renk']],sabitler:['Madde miktarı: 1 mL (katılar için bir spatül ucu)','Sıcaklık: oda sıcaklığı','Temiz tüp ve pens'],varsayilanBagimsiz:'su',
  tablo:[['md','Madde'],['p','Okunan değer'],['o','Özellik']],
  dugmeler:[['kur','🧰 Tüpü hazırla','p'],['olc','📄 Ölç','o'],['kay','✔ Kaydet','g']],
  ipucu:'Bir madde seç, eklenecek su miktarını ve ölçüm aracını belirle. Tüpü hazırla, ölç, kaydet. Seyrelmenin etkisini görmek için maddeyi sabit tutup suyu değiştir.',
  baslangic(P){P.enable(['olc','kay'],false);TB.forEach(t=>t.g.setAttribute('opacity',0));},
  async on(id,P){const c=P.cfgNow(),i=+c.md,d=MD[i];
   if(id==='kur'){TB.forEach((t,k)=>{t.g.setAttribute('opacity',k===i?1:.15);t.set(0);t.ppt(0);});const t=TB[i];
     if(d[5]){t.ppt(.9,d[4]);t.set(.4,'rgba(230,240,252,.85)');}else t.set(3,d[4]);if(+c.su)await tween(600,k=>t.set(t.vol+(+c.su>12?12:+c.su)*k/6));
     P.enable(['olc'],true);P.enable(['kay'],false);P.tip(`${d[0]} ${+c.su?'+ '+c.su+' mL saf su':''} hazır. Ölç.`);return;}
   if(id==='olc'){const pH=pHsu(i,+c.su);let txt;if(c.arac==='lahana'){const col=CH.scaleColor(pH,'lahana');TB[i].set(TB[i].vol,col.rgba);txt=col.name+' renk';}else{const col=await cfg.dip(P,i,pH);txt=c.arac==='metre'?'pH '+fmt(pH,2):'pH ≈ '+Math.round(pH)+' ('+col.name+')';}
     P.set('m',d[0]);P.set(+c.su?'p2':'p1',c.arac==='lahana'?txt:c.arac==='metre'?fmt(pH,2):String(Math.round(pH)));P.cur={pH,txt};P.enable(['kay'],true);return;}
   if(id==='kay'&&P.cur){const pH=P.cur.pH;P.record({md:d[0],su:+c.su?c.su+' mL':'yok',p:P.cur.txt,o:pH<6.6?'asidik':pH>7.4?'bazik':'nötre yakın'});
     P.say(`${d[0]}: ${pH<7?'asidik':'bazik'} madde. `+(d[3]==='t'?'Karbonat (NaHCO₃) çözeltisi seyrelmeye karşı pH’ını korur; değer pek değişmez.':'Su ekledikçe çözelti seyrelir ve pH 7’ye yaklaşır.')+(c.arac==='kagit'?' pH kâğıdı yaklaşık (tam sayı) değer verir; pH metre daha hassastır.':''));
     P.enable(['kay'],false);P.tip('Yeni deneme: sadece bağımsız değişkeni değiştir.');}},
  sorular:[{q:'Sirkeye eklenen su miktarı arttıkça pH nasıl değişir?',o:['Azalır','Artar ve 7’ye yaklaşır','14’e çıkar','Değişmez'],a:1,e:'Sirke asidiktir; seyreldikçe [H⁺] azalır, pH 7’ye yaklaşır ama 7’yi geçmez.'},
   {q:'pH kâğıdı ile pH metre arasındaki fark nedir?',o:['pH kâğıdı daha hassastır','pH metre daha hassas (ondalıklı) ölçüm yapar','İkisi aynıdır','pH metre renk gösterir'],a:1,e:'pH kâğıdı renk karşılaştırmasıyla yaklaşık değer verir; pH metre sayısal ve hassastır.'},
   {q:'Kırmızı lahana suyu bazik bir maddede hangi renge döner?',o:['Kırmızı','Mavi-yeşil','Turuncu','Renksiz'],a:1,e:'Kırmızı lahana suyu (antosiyanin) asitte kırmızı-pembe, nötrde mor, bazda mavi-yeşil-sarı renk alır.'}]}
};
LK.page(cfg);
})();
</script></body></html>
