<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sanal Lab · Gümüş Ağacı</title></head>
<body><script src="labkit.js"></script><script>
(()=>{const {CH,el,fmt,tr,sleep,tween,fade}=LK;
const AKT=['Mg','Zn','Fe','Pb','Cu','Ag'];const MR={Mg:'#e5e7eb',Zn:'#94a3b8',Fe:'#57534e',Pb:'#6b7280',Cu:'#c2410c',Ag:'#d1d5db'};
const COZ={AgNO3:['AgNO₃','Ag','rgba(196,226,255,.82)','#e5e7eb'],CuSO4:['CuSO₄','Cu','rgba(56,140,230,.6)','#c2410c'],ZnSO4:['ZnSO₄','Zn','rgba(196,226,255,.82)','#94a3b8'],FeSO4:['FeSO₄','Fe','rgba(180,220,190,.75)','#57534e']};
const IYON={Mg:'rgba(196,226,255,.82)',Zn:'rgba(196,226,255,.82)',Fe:'rgba(180,220,190,.8)',Pb:'rgba(196,226,255,.82)',Cu:'rgba(56,140,230,.65)',Ag:'rgba(196,226,255,.82)'};
let BK,WP,TREE,WIRE,TREE2;
function tree(S,g,x,y,col){const T=el('g',{},g);const br=[];let seed=7;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
 for(let i=0;i<60;i++){const x0=x+(r()-.5)*24,y0=y-r()*120,a=r()*Math.PI*2,l=6+r()*12;br.push(el('line',{x1:x0,y1:y0,x2:x0,y2:y0,stroke:col,'stroke-width':2.2,'stroke-linecap':'round',_a:a,_l:l},T));}
 return {T,grow(f){br.forEach((b,i)=>{const k=Math.max(0,Math.min(1,f*1.6-i/60*.6));const a=+b.getAttribute('_a'),l=+b.getAttribute('_l');b.setAttribute('x2',+b.getAttribute('x1')+Math.cos(a)*l*k);b.setAttribute('y2',+b.getAttribute('y1')+Math.sin(a)*l*k);});},color(c){br.forEach(b=>b.setAttribute('stroke',c));}};}
function wire(S,g,x,y,col){const w=el('path',{d:`M${x} ${y-150} L${x} ${y-120} `+Array.from({length:8},(_,i)=>`Q${x+(i%2?14:-14)} ${y-112+i*13} ${x} ${y-106+i*13}`).join(' '),fill:'none',stroke:col,'stroke-width':3},g);return w;}
const cfg={ad:'gumusagaci',baslik:'Gümüş Ağacı: Makro ve Mikro Ölçek',alt:'10. sınıf · 3.1 Kimya ve Sürdürülebilirlik · Bakır tel ile gümüş nitrat çözeltisi (redoks)',
 malzemeler:['Bakır tel','0,1 M AgNO₃ çözeltisi','Beherglas (makro)','Kuyu plaka (mikro)','Damlalık','Zımpara kâğıdı'],
 guvenlik:['⚠ Koruyucu gözlük','🧤 Eldiven','🖐 AgNO₃ deride leke bırakır','♻ Gümüş atığını ayrı topla'],
 olcumler:[['o','Ölçek',''],['g','Gözlem',''],['m','AgNO₃ kullanımı','mL']],
 adimlar:[['Bakır teli hazırla','Bakır teli zımparala ve sarmal hâline getir.'],
  ['Makro: 150 mL AgNO₃','Behere 150 mL 0,1 M AgNO₃ koy ve bakır teli daldır.'],
  ['Gümüş kristalleri büyür','Telin üzerinde parlak gümüş kristalleri “ağaç dalları” gibi büyür; çözelti yavaşça maviye döner.'],
  ['Mikro: 5 damla AgNO₃','Kuyu plakaya 5 damla AgNO₃ damlat ve kısa bir bakır tel parçası koy: aynı gümüş kristalleri oluşur.'],
  ['Sonuç','Cu + 2Ag⁺ → Cu²⁺ + 2Ag. Cu, Ag’den aktif olduğu için Ag⁺ iyonlarını indirger. Mikro ölçekte aynı gözlem ≈ 600 kat daha az AgNO₃ ile elde edilir.']],
 async kur(P,m){const S=P.S;BK=S.beaker(130,520,120,140,250,'');BK.g.setAttribute('opacity',1);WP=S.wellPlate(250,430,3,2,16);WP.g.setAttribute('opacity',1);S.txt(WP.g,305,520,'kuyu plaka',9);
  WIRE=wire(S,BK.g,130,515,MR.Cu);WIRE.setAttribute('opacity',0);TREE=tree(S,BK.g,130,505,'#9ca3af');TREE.grow(0);
  TREE2=el('g',{},S.top);},
 async calistir(P){P.rows=[];
  P.stepUI(0);await fade(WIRE,1,600);P.set('g','zımparalandı');await sleep(1200);
  P.stepUI(1);P.set('o','makro');await tween(1500,k=>BK.set(150*k,COZ.AgNO3[2]));P.set('m','150');await sleep(500);
  P.stepUI(2);await tween(6000,k=>{TREE.grow(k);BK.set(150,`rgba(${Math.round(196-140*k)},${Math.round(226-86*k)},${Math.round(255-25*k)},.75)`);});P.set('g','gümüş kristalleri, mavi çözelti');P.rows.push(['Makro','150 mL','gümüş ağacı, mavi çözelti']);await sleep(800);
  P.stepUI(3);P.set('o','mikro');const w=WP.W[0];await tween(800,k=>w.set(COZ.AgNO3[2],k));el('line',{x1:w.cx-8,y1:w.cy,x2:w.cx+8,y2:w.cy,stroke:MR.Cu,'stroke-width':3},TREE2);
  const t2=tree(P.S,TREE2,w.cx,w.cy+8,'#e5e7eb');t2.T.setAttribute('transform',`translate(${w.cx} ${w.cy}) scale(.12) translate(${-w.cx} ${-w.cy})`);
  await tween(3000,k=>{t2.grow(k);w.set(`rgba(${Math.round(196-140*k)},${Math.round(226-86*k)},255,.8)`,1);});P.set('m','0,25');P.set('g','aynı gözlem');P.rows.push(['Mikro','5 damla (0,25 mL)','gümüş kristalleri']);
  P.stepUI(4);await sleep(800);
  P.calc('<b>Gözlemler</b><table><tr><th>Ölçek</th><th>AgNO₃</th><th>Gözlem</th></tr>'+P.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')+'</table><p style="margin:.5em 0 0">Cu(k) + 2AgNO₃(suda) → Cu(NO₃)₂(suda) + 2Ag(k)</p>');
  P.done('Bakır, gümüş iyonlarını gümüş metaline indirgedi (gümüş ağacı) ve Cu²⁺ olarak çözeltiye geçti (mavi renk). Mikro ölçek çok daha az kimyasalla aynı sonucu verdi.');},
 rapor:P=>[['Deneyin Adı','Gümüş Ağacı'],['Deneyin Amacı','Metallerin aktifliğine dayalı redoks tepkimesini makro ve mikro ölçekte gözlemleyebilme'],['Tarih',new Date().toLocaleDateString('tr-TR')],['Malzemeler',cfg.malzemeler.join(', ')],
  ['Deneyin Yapılışı',cfg.adimlar.slice(0,4).map((x,i)=>`${i+1}. ${x[1]}`).join('<br>')],['Gözlemler',P.rows.map(r=>`${r[0]}: ${r[1]} → ${r[2]}`).join('<br>')],
  ['Sonuç','Aktif metal (Cu), daha az aktif metalin (Ag) iyonlarını indirger: Cu yükseltgenir, Ag⁺ indirgenir. Mikro ölçekli deney aynı bilgiyi çok daha az kimyasal ve atıkla verir.']],
 sorular:[{q:'Gümüş ağacı deneyinde yükseltgenen tür hangisidir?',o:['Ag⁺','Cu','NO₃⁻','Ag'],a:1,e:'Cu elektron verip Cu²⁺ olur.'},{q:'Çözeltinin maviye dönmesinin nedeni nedir?',o:['Ag⁺ iyonları','Cu²⁺ iyonları','NO₃⁻ iyonları','Su'],a:1,e:'Cu²⁺ iyonları suda mavi renk verir.'},{q:'Gümüş tel CuSO₄ çözeltisine daldırılırsa ne olur?',o:['Bakır kaplanır','Tepkime olmaz','Gümüş erir','Gaz çıkar'],a:1,e:'Ag, Cu’dan az aktiftir; Cu²⁺’yı indirgeyemez.'}],
 dene:{alanlar:[{id:'m',ad:'Metal',secenek:AKT.map(k=>[k,k]),deger:'Zn'},{id:'c',ad:'Çözelti',secenek:Object.keys(COZ).map(k=>[k,COZ[k][0]]),deger:'CuSO4'}],
  bagimli:[['g','Metal yüzeyinde kaplama / renk değişimi']],sabitler:['Derişim: 0,1 M','Süre: 10 dk','Mikro ölçek (kuyu plaka)'],varsayilanBagimsiz:'m',tablo:[['g','Gözlem'],['e','Sonuç']],
  dugmeler:[['go','▶ Metali kuyuya koy','p'],['kay','✔ Kaydet','g']],ipucu:'Bir metal ve bir çözelti seç. Metal, çözeltideki metal iyonundan daha aktifse kaplama oluşur.',
  baslangic(P){P.enable(['kay'],false);},
  async on(id,P){const c=P.cfgNow(),M=c.m,Z=COZ[c.c],ion=Z[1];
   if(id==='go'){TREE2.innerHTML='';const w=WP.W[1];w.set(Z[2],1);el('line',{x1:w.cx-8,y1:w.cy,x2:w.cx+8,y2:w.cy,stroke:MR[M],'stroke-width':3},TREE2);const ok=AKT.indexOf(M)<AKT.indexOf(ion);
     if(ok){const t=tree(P.S,TREE2,w.cx,w.cy+8,Z[3]);t.T.setAttribute('transform',`translate(${w.cx} ${w.cy}) scale(.12) translate(${-w.cx} ${-w.cy})`);await tween(2500,k=>{t.grow(k);w.set(IYON[M],1);});}else await sleep(2000);
     P.set('g',ok?`${ion} kaplama oluştu`:'değişiklik yok');P.cur={g:ok?`${M} yüzeyinde ${ion} birikti`:'tepkime yok',e:ok?`${M} + ${ion}²⁺/⁺ → ${M} iyonu + ${ion}`:`${M}, ${ion}’den az aktif`};P.enable(['kay'],true);return;}
   if(id==='kay'&&P.cur){P.record(P.cur);P.say('Aktiflik: Mg > Zn > Fe > Pb > Cu > Ag. Daha aktif metal, daha az aktif metalin iyonlarını indirger.');P.enable(['kay'],false);}},
  sorular:[{q:'Zn, FeSO₄ çözeltisine konursa ne olur?',o:['Zn üzerinde Fe birikir','Tepkime olmaz','Zn kaplanmaz, Fe çözünür','Gaz çıkar'],a:0,e:'Zn, Fe’den aktiftir.'}]}
};
LK.page(cfg);
})();
</script></body></html>
