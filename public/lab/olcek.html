<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sanal Lab · Makro ve Mikro Ölçek</title></head>
<body><script src="labkit.js"></script><script>
(()=>{const {CH,el,fmt,tr,sleep,tween,fade}=LK;
// tepkime: ad, makro{su, temizlik, kimyasal g}, mikro{...}, gözlem, denklem
const R={cok:['Çökelme (AgNO₃ + Na₂CO₃)',[200,300,11],[20,10,0.11],'sarımsı beyaz çökelek','2AgNO₃ + Na₂CO₃ → Ag₂CO₃(k) + 2NaNO₃'],
 ab:['Asit-baz (sirke + NaHCO₃)',[100,250,10+5],[1,5,0.15],'gaz çıkışı (CO₂), köpürme','CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂'],
 rx:['Redoks (Zn + 1 M HCl)',[100,250,3.6+2],[1,5,.0365+.2],'gaz çıkışı (H₂), Zn küçülür','Zn + 2HCl → ZnCl₂ + H₂']};
let A1,A2,A3,WP;
const cfg={ad:'olcek',baslik:'Makro ve Mikro Ölçekli Deneyler',alt:'10. sınıf · 3.1.1 Makro ve Mikro Ölçekli Deneyler · Aynı tepkimeyi iki ölçekte yapıp çevreye etkisini karşılaştırma',
 malzemeler:['AgNO₃ katısı','Na₂CO₃ katısı','Zn parçaları','1 M HCl','Sirke','NaHCO₃','250 mL beherglaslar','Kuyu plaka (buz kalıbı)','Spatül','Pipet / damlalık','Puar','Hassas terazi','Saf su','Dereceli silindir'],
 guvenlik:['⚠ Koruyucu gözlük','🧤 Eldiven','♻ Atıkları ayrı topla','🌍 Az kimyasal = az atık'],
 olcumler:[['o','Ölçek',''],['su','Kullanılan su','mL'],['km','Kimyasal madde','g']],
 grafik:null,
 adimlar:[['Makro ölçek: çökelme','1 g AgNO₃’ı 100 mL suda, 10 g Na₂CO₃’ı 100 mL suda çöz. AgNO₃ çözeltisini Na₂CO₃ çözeltisine damla damla ekle: sarımsı beyaz Ag₂CO₃ çökeleği oluşur.'],
  ['Mikro ölçek: çökelme','10 mL suda 0,01 g AgNO₃ ve 10 mL suda 0,1 g Na₂CO₃ çöz. Kuyu plakada birkaç damla AgNO₃ çözeltisine pipetle Na₂CO₃ çözeltisi ekle: aynı çökelek oluşur.'],
  ['Makro ölçek: asit-baz ve redoks','Bir beherglasta 100 mL sirkeye 10 g NaHCO₃ ekle (köpürme, CO₂). Diğerinde 100 mL 1 M HCl’ye birkaç Zn parçası ekle (H₂ kabarcıkları).'],
  ['Mikro ölçek: asit-baz ve redoks','Kuyu plakada 20 damla HCl’ye küçük bir Zn parçası; başka kuyuda 0,1 g NaHCO₃ üzerine 20 damla sirke ekle. Aynı gözlemler, çok daha az madde.'],
  ['Su ve kimyasal miktarını karşılaştır','Deney ve temizlikte kullanılan toplam su ile kimyasal madde miktarını tabloya yaz: mikro ölçek yaklaşık 10–100 kat daha az kaynak harcar ve daha az atık üretir.']],
 async kur(P,m){const S=P.S;A1=S.beaker(70,520,80,100,250,'');A1.l=S.txt(A1.g,70,538,'makro',9);A2=S.beaker(165,520,80,100,250,'');A2.l=S.txt(A2.g,165,538,'makro',9);
  WP=S.wellPlate(232,400,4,3,15);S.txt(WP.g,316,520,'kuyu plaka (mikro)',9);[A1.g,A2.g,WP.g].forEach(g=>g.setAttribute('opacity',1));P.top={su:0,km:0};},
 async calistir(P){const S=P.S;P.rows=[];const W=WP.W;
  P.stepUI(0);P.set('o','makro');A1.l.textContent='Na₂CO₃';A2.l.textContent='AgNO₃';await tween(1200,k=>{A1.set(100*k);A2.set(100*k);});
  await tween(3200,k=>{A2.set(100*(1-k));A1.set(100+100*k*.98,'rgba(240,236,220,.9)');A1.ppt(k*.6,'rgba(245,240,210,.98)');A1.cloudy(k*.5,'rgba(245,240,215,.5)');});P.set('su','500');P.set('km','11');P.rows.push(['Çökelme','makro',500,11]);await sleep(800);
  P.stepUI(1);P.set('o','mikro');await tween(800,k=>W[0].set('rgba(196,226,255,.9)',k));await tween(1400,k=>{W[0].set(`rgba(${Math.round(196+44*k)},${Math.round(226+10*k)},${Math.round(255-35*k)},.95)`,1);W[0].ppt('rgba(245,240,210,1)',k);});P.set('su','30');P.set('km','0,11');P.rows.push(['Çökelme','mikro',30,0.11]);await sleep(800);
  P.stepUI(2);P.set('o','makro');A1.set(0);A1.ppt(0);A1.cloudy(0);A1.l.textContent='sirke';A2.l.textContent='HCl';await tween(1000,k=>{A1.set(100*k,'rgba(240,235,215,.82)');A2.set(100*k,'rgba(196,226,255,.82)');});
  const z=S.pieces(A2,5,'#94a3b8','parca'),s=S.pieces(A1,30,'#fff','toz');A1.bubbles(.9);A2.bubbles(.45);const F=S.foam(70,420,70,40,'rgba(255,255,255,.95)');await tween(3600,k=>{F.set(Math.sin(Math.PI*Math.min(1,k*1.3))*.9);s.shrink(k);});A1.bubbles(.05);
  P.set('su','350 + 350');P.set('km','15 + 5,6');P.rows.push(['Asit-baz','makro',350,15],['Redoks','makro',350,5.6]);await sleep(600);
  P.stepUI(3);P.set('o','mikro');await tween(900,k=>{W[1].set('rgba(196,226,255,.9)',k);W[2].set('rgba(240,235,215,.9)',k);});W[1].bubbles(.25);W[2].bubbles(.7);await sleep(2600);W[2].bubbles(.05);
  P.set('su','6 + 6');P.set('km','0,24 + 0,15');P.rows.push(['Redoks','mikro',6,0.24],['Asit-baz','mikro',6,0.15]);await sleep(600);
  P.stepUI(4);A2.bubbles(.1);W[1].bubbles(.1);P.set('o','makro / mikro');const tm=P.rows.filter(r=>r[1]==='makro'),ti=P.rows.filter(r=>r[1]==='mikro');const su=a=>a.reduce((x,r)=>x+r[2],0),km=a=>a.reduce((x,r)=>x+r[3],0);
  P.set('su',`${su(tm)} / ${su(ti)}`);P.set('km',`${fmt(km(tm),1)} / ${fmt(km(ti),2)}`);await sleep(1200);
  P.calc('<b>Kaynak kullanımı (deney + temizlik)</b><table><tr><th>Tepkime</th><th>Ölçek</th><th>Toplam su (mL)</th><th>Toplam kimyasal (g)</th></tr>'+P.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${fmt(r[3],2)}</td></tr>`).join('')+`<tr><th colspan="2">Toplam makro / mikro</th><th>${su(tm)} / ${su(ti)}</th><th>${fmt(km(tm),1)} / ${fmt(km(ti),2)}</th></tr></table>`);
  P.done('Aynı gözlemler mikro ölçekte de elde edildi; ancak mikro ölçek çok daha az su ve kimyasal kullandı, daha az atık üretti. Bu, yeşil kimyanın atık önleme ilkesine uygundur.');},
 rapor:P=>[['Deneyin Adı','Makro ve Mikro Ölçekli Deneyler'],['Deneyin Amacı','Çökelme, asit-baz ve redoks tepkimelerini makro ve mikro ölçekte gözlemleyip ekosisteme etkilerini karşılaştırabilme'],['Tarih',new Date().toLocaleDateString('tr-TR')],['Malzemeler',cfg.malzemeler.join(', ')],
  ['Deneyin Yapılışı',cfg.adimlar.slice(0,4).map((x,i)=>`${i+1}. ${x[1]}`).join('<br>')],['Gözlemler',P.rows.map(r=>`${r[0]} (${r[1]}): su ${r[2]} mL, kimyasal ${fmt(r[3],2)} g`).join('<br>')],
  ['Sonuç','Makro ve mikro ölçekte aynı gözlemler (çökelek, gaz çıkışı) elde edilir. Ölçütler: deney ve temizlikte kullanılan toplam su, kullanılan kimyasal madde miktarı ve oluşan atık. Mikro ölçekli deneyler kaynak tasarrufu sağlar, atığı ve maliyeti azaltır, güvenliği artırır; ekosisteme etkisi daha azdır.']],
 sorular:[
  {q:'Makro ve mikro ölçekli deneylerin gözlemleri arasında temel fark nedir?',o:['Mikroda tepkime olmaz','Gözlemler aynıdır, kullanılan madde miktarı farklıdır','Mikroda başka ürün oluşur','Makroda renk değişmez'],a:1,e:'Tepkime aynıdır; yalnızca miktarlar küçülür.'},
  {q:'Ekosisteme etkiyi değerlendirmek için hangisi uygun bir ölçüt DEĞİLDİR?',o:['Toplam su miktarı','Kimyasal atık miktarı','Beherin markası','Kullanılan kimyasal miktarı'],a:2,e:'Ölçütler kaynak kullanımı ve atıkla ilgilidir.'},
  {q:'Mikro ölçekli deney hangi yeşil kimya ilkesiyle en çok ilişkilidir?',o:['Atık önleme','Yüksek sıcaklık','Çok çözücü kullanma','Hızlı üretim'],a:0,e:'Az madde kullanmak, oluşacak atığı baştan önler.'}],
 dene:{
  alanlar:[{id:'t',ad:'Tepkime',secenek:[['cok','Çökelme'],['ab','Asit-baz'],['rx','Redoks']],deger:'cok'},{id:'o',ad:'Ölçek',secenek:[['makro','Makro (beherglas)'],['mikro','Mikro (kuyu plaka)']],deger:'makro'}],
  bagimli:[['su','Toplam su'],['km','Kimyasal madde miktarı']],sabitler:['Aynı derişimler','Aynı tepkime süresi','Temizlik aynı yöntemle'],varsayilanBagimsiz:'o',
  tablo:[['g','Gözlem'],['su','Toplam su'],['km','Kimyasal']],
  dugmeler:[['go','▶ Deneyi yap','p'],['kay','✔ Kaydet','g']],
  ipucu:'Tepkimeyi sabit tut, ölçeği değiştir. Su ve kimyasal madde kullanımını karşılaştır.',
  baslangic(P){P.enable(['kay'],false);},
  async on(id,P){const c=P.cfgNow(),r=R[c.t],d=c.o==='makro'?r[1]:r[2];
   if(id==='go'){A1.set(0);A1.ppt(0);A1.cloudy(0);A1.bubbles(0);WP.W.forEach(w=>{w.set('rgba(0,0,0,0)',0);w.ppt('#fff',0);w.bubbles(0);});
     if(c.o==='makro'){A1.l.textContent=r[0].split(' ')[0];await tween(1200,k=>A1.set(150*k,c.t==='cok'?'rgba(240,236,220,.9)':'rgba(220,235,250,.85)'));if(c.t==='cok')A1.ppt(.6,'rgba(245,240,210,.98)');else{A1.bubbles(.8);await sleep(1500);A1.bubbles(.1);}}
     else{const w=WP.W[0];await tween(900,k=>w.set(c.t==='cok'?'rgba(240,236,220,.95)':'rgba(220,235,250,.9)',k));if(c.t==='cok')w.ppt('rgba(245,240,210,1)',1);else{w.bubbles(.6);await sleep(1500);w.bubbles(.05);}}
     const su=d[0]+d[1];P.set('o',c.o);P.set('su',String(su));P.set('km',fmt(d[2],2));P.cur={g:r[3],su:su+' mL',km:fmt(d[2],2)+' g'};P.enable(['kay'],true);return;}
   if(id==='kay'&&P.cur){P.record(P.cur);P.say(`${r[4]}. Makro: ${r[1][0]+r[1][1]} mL su, ${fmt(r[1][2],1)} g kimyasal · Mikro: ${r[2][0]+r[2][1]} mL su, ${fmt(r[2][2],2)} g kimyasal.`);P.enable(['kay'],false);}},
  sorular:[{q:'Bu denemede bağımsız değişken hangisidir?',o:['Ölçek','Toplam su','Kimyasal miktarı','Gözlem'],a:0,e:'Değiştirdiğimiz ölçektir; su ve kimyasal kullanımı bağımlı değişkendir.'},
   {q:'Mikro ölçeğin bir sınırlılığı ne olabilir?',o:['Gözlemlerin küçük ve zor görülmesi','Daha çok atık','Daha pahalı olması','Daha tehlikeli olması'],a:0,e:'Az madde, gözlemi zorlaştırabilir; büyüteç veya beyaz zemin kullanılır.'}]}
};
LK.page(cfg);
})();
</script></body></html>
