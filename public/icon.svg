<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3cf5"/><stop offset=".5" stop-color="#8e2fd0"/><stop offset="1" stop-color="#0fb5a8"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ff7cf"/><stop offset="1" stop-color="#14a982"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe46b"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
    <clipPath id="fl"><path d="M222 196v70l-70 124a24 24 0 0 0 21 36h166a24 24 0 0 0 21-36l-70-124v-70z"/></clipPath>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- arka plan denklemleri -->
    <g font-family="Arial, sans-serif" font-weight="700" fill="#fff" opacity=".16">
      <text x="24" y="70" font-size="34">2H₂ + O₂ → 2H₂O</text>
      <text x="250" y="128" font-size="28">PV = nRT</text>
      <text x="18" y="470" font-size="30">CH₄ + 2O₂ → CO₂ + 2H₂O</text>
      <text x="330" y="300" font-size="26">pH = 7</text>
      <text x="14" y="268" font-size="26">n = m/M</text>
      <text x="300" y="500" font-size="24">ΔH &lt; 0</text>
    </g>
    <!-- molekül (H2O) -->
    <g>
      <line x1="104" y1="176" x2="70" y2="214" stroke="#fff" stroke-width="8" opacity=".9"/>
      <line x1="104" y1="176" x2="148" y2="206" stroke="#fff" stroke-width="8" opacity=".9"/>
      <circle cx="104" cy="172" r="26" fill="#ff5d6c"/>
      <circle cx="66" cy="218" r="15" fill="#fff"/><circle cx="152" cy="210" r="15" fill="#fff"/>
    </g>
    <!-- periyodik kutucuk -->
    <g transform="translate(358 150) rotate(8)">
      <rect width="98" height="108" rx="16" fill="#fff"/>
      <text x="12" y="28" font-family="Arial" font-size="20" font-weight="700" fill="#5b3cf5">6</text>
      <text x="49" y="82" font-family="Arial" font-size="54" font-weight="800" fill="#2b1f7a" text-anchor="middle">C</text>
    </g>
    <!-- sıvı + tüp -->
    <g clip-path="url(#fl)">
      <rect x="140" y="330" width="240" height="100" fill="url(#liq)"/>
      <path d="M140 334q30-14 60 0t60 0 60 0 60 0v10H140z" fill="#b3fbe7"/>
    </g>
    <g fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <path d="M206 196h100"/>
      <path d="M222 196v70l-70 124a24 24 0 0 0 21 36h166a24 24 0 0 0 21-36l-70-124v-70"/>
    </g>
    <circle cx="236" cy="380" r="9" fill="#fff"/><circle cx="268" cy="360" r="6" fill="#fff"/>
    <!-- koç: yükselen ok + yıldız -->
    <path d="M262 312l40-40 26 18 56-66" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M350 222h38v38" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 96l10 21 23 3-17 16 4 23-20-11-20 11 4-23-17-16 23-3z" fill="url(#gold)"/>
  </g>
</svg>
